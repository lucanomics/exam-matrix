      title: tp.title,
      rhs: `<div>${esc(tp.archetypeLabel)}</div>`,
    })}
    ${decisive}${traps}${evidence}
  </section>`;
}

function pageErrorLog(model, t) {
  const rows = model.error_log;
  // Round the blank rows up to a whole page so the log never spills two rows
  // onto an otherwise empty sheet.
  const PER_PAGE = 11;
  const wanted = rows.length + (model.blank_rows.error_log ?? 9);
  const blanks = PER_PAGE * Math.ceil(wanted / PER_PAGE) - rows.length;
  const cell = (v) => `<td>${esc(v ?? '')}</td>`;
  const body = [
    ...rows.map((e) => `<tr style="height:12mm">
      <td class="nowrap">${esc(e.date ?? '')}</td>${cell(e.question)}${cell(e.topic)}${cell(e.mine)}${cell(e.correct)}
      <td>${e.error_type ? `<span class="pill b">${esc(t.etypes[e.error_type])}</span>` : ''}</td>
      ${cell(e.missing_distinction)}
      <td class="m-distinction" style="font-size:8pt">${esc(e.matrix_update?.text ?? '')}</td>
      ${cell(e.retest)}</tr>`),
    ...Array.from({ length: blanks }, () => `<tr style="height:12mm">${'<td></td>'.repeat(9)}</tr>`),
  ].join('');

  return `<section class="page land">
  ${head(t, { eyebrow: t.brand, title: t.errorlog, sub: t.errorlog_hint })}
  <table>
    <thead><tr>
      <th class="nowrap" style="width:8%">${t.l_date}</th><th style="width:9%">${t.l_q}</th>
      <th style="width:12%">${t.l_topic}</th><th style="width:7%">${t.l_mine}</th>
      <th style="width:7%">${t.l_correct}</th><th style="width:11%">${t.l_type}</th>
      <th style="width:18%">${t.l_missing}</th><th style="width:21%">${t.l_update}</th>
      <th class="nowrap" style="width:8%">${t.l_retest}</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table>
  <div class="legend">${Object.entries(t.etypes).map(([, v]) => `<span>· ${esc(v)}</span>`).join('')}</div>
</section>`;
}

function pageCompression(model, t) {
  const c = model.compression ?? {};
  const l2 = c.l2 ?? [], l3 = c.l3 ?? [];
  return `<section class="page">
  ${head(t, { eyebrow: t.brand, title: t.compression, sub: model.exam.name })}
  <div class="ladder block">
    <div><div class="lv">L1</div><div class="nm">${t.l1n}</div><div class="ds">${t.l1d}</div></div>
    <div><div class="lv">L2</div><div class="nm">${t.l2n}</div><div class="ds">${t.l2d}</div></div>
    <div><div class="lv">L3</div><div class="nm">${t.l3n}</div><div class="ds">${t.l3d}</div></div>
  </div>

  <h2 class="section">${t.l2h}</h2>
  ${l2.length ? `<table class="block"><thead><tr>
      <th class="nowrap" style="width:12%">${t.legend}</th><th style="width:32%">${t.topic}</th><th>${t.p_clue}</th>
    </tr></thead><tbody>${l2.map((i) => `<tr style="height:10mm">
      <td>${i.mark ? `<span class="chip">${MARKERS[i.mark].sigil} ${esc(markLabel(i.mark, t))}</span>` : ''}</td>
      <td class="${i.mark ? `m-${i.mark}` : ''}"><b>${esc(i.item)}</b></td>
      <td>${esc(i.detail ?? '')}</td></tr>`).join('')}</tbody></table>`
    : '<div class="lines tall block"></div>'}

  <h2 class="section">${t.l3h}</h2>
  ${l3.length ? `<ul class="l3 block">${l3.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`
    : '<div class="lines tall block"></div>'}

  ${reviewTable(model, t)}
</section>`;
}

/**
 * Review state rides along at the foot of the compression page rather than
 * claiming one of its own. It is bookkeeping, and the brief this was built
 * against is explicit that it must stay subordinate to the learning content.
 */
function reviewTable(model, t) {
  return `
  <h2 class="section">${t.review}<span class="hint">${t.review_hint}</span></h2>
  <table class="review block">
    <thead><tr>
      <th style="width:34%">${t.topic}</th><th style="width:11%">${t.r_learned}</th>
      <th style="width:11%">R1</th><th style="width:11%">R2</th><th style="width:11%">R3</th>
      <th style="width:11%">${t.r_mastered}</th><th style="width:11%">${t.r_revisit}</th>
    </tr></thead>
    <tbody>${model.topics.map((tp) => `<tr>
      <td>${String(tp.index).padStart(2, '0')} &nbsp; ${esc(tp.title)}</td>
      ${'<td></td>'.repeat(6)}</tr>`).join('')}</tbody>
  </table>`;
}

function pagesAnswerKey(model, t) {
  const key = model.recall?.key ?? [];
  return `<section class="page">
  ${head(t, { eyebrow: `${t.brand} · ${t.ed_key}`, title: t.key_title, sub: t.key_hint,
              rhs: `<div>${model.recall?.total ?? 0} items</div>` })}
  <div class="answer-key">
    ${key.map((k) => `<div class="ak-topic">
      <h3>${String(k.topic.index).padStart(2, '0')} · ${esc(k.topic.title)}</h3>
      <ol>${k.items.map((i) => `<li>
        <span class="n">⟨${i.ref}⟩</span> ${esc(i.answer)}
        <div class="w">${esc(i.where)} · ${DIFFICULTY_GLYPH[i.difficulty]}</div>
      </li>`).join('')}</ol>
    </div>`).join('')}
  </div>
</section>`;
}

/* ------------------------------------------------------------------ export */

function renderDocument(model, edition, css) {
  const t = T[model.lang] ?? T.en;
  const edLabel = { full: t.ed_full, recall: t.ed_recall, key: t.ed_key }[edition];

  let pages;
  if (edition === 'key') {
    pages = pagesAnswerKey(model, t);
  } else {
    pages = [
      pageDashboard(model, t, edLabel),
      pageBlueprint(model, t),
      ...model.topics.flatMap((tp) => [
        pageTopicOpen(tp, model, t, edition),
        pagesMatrix(tp, model, t, edition),
        pageDistinction(tp, model, t, edition),
      ]),
      pageErrorLog(model, t),
      pageCompression(model, t),
    ].filter(Boolean).join('\n');
  }

  return `<!doctype html>
<html lang="${model.lang}">
<head>
<meta charset="utf-8">
<title>${esc(model.exam.name)} — ${esc(edLabel)}</title>
<style>${css}</style>
</head>
<body>
${pages}
</body>
</html>`;
}

function footerTemplate(model, edition) {
  const t = T[model.lang] ?? T.en;
  const edLabel = { full: t.ed_full, recall: t.ed_recall, key: t.ed_key }[edition];
  // padding-bottom lifts the footer clear of the trim edge: Chromium bottom-aligns
  // this box inside the page margin, so without it the text sits ~4mm from the cut.
  return `<div style="width:100%;font-family:'Noto Sans CJK KR',sans-serif;font-size:7pt;
      color:#6b727d;padding:2mm 15mm 6mm;display:flex;justify-content:space-between;
      border-top:.5pt solid #d8dce1;">
    <span>${esc(model.exam.name)} · ${esc(edLabel)}</span>
    <span>${esc(t.brand)}</span>
    <span><span class="pageNumber"></span> / <span class="totalPages"></span></span>
  </div>`;
}

  return { renderDocument, footerTemplate, EDITIONS, normalizeExam, stripEmpty, applyRecall, ARCHETYPES, ARCHETYPE_KEYS, MARKERS, defaultColumns, CSS: "/* ==========================================================================\n   Exam Matrix — print design system\n   A4 · duplex · grayscale-safe · handwriting-first\n   Semantic markers are encoded three ways (label + border + tint) so that\n   nothing is lost when the PDF is photocopied in black and white.\n   ========================================================================== */\n\n/* Bottom margins carry the running footer. They are deep enough that the\n   footer text clears the unsafe trim zone on a domestic printer — verified by\n   scripts/visual-qa.js, which fails the build if any glyph comes within 6mm of\n   a page edge. */\n@page {\n  size: A4 portrait;\n  margin: 16mm 15mm 15mm 15mm;\n}\n@page land {\n  size: A4 landscape;\n  margin: 14mm 13mm 14mm 13mm;\n}\n\n:root {\n  --ink:        #14171c;\n  --ink-2:      #3d434d;\n  --muted:      #6b727d;\n  --rule:       #a8afb9;\n  --hair:       #d8dce1;\n  --accent:     #1f4b73;\n\n  --tint-1:     #f5f6f8;\n  --tint-2:     #eceef2;\n  --tint-exc:   #f0ece5;\n  --tint-trap:  #e7e5e9;\n\n  /* Noto CJK first: that is what the committed PDFs are built with. The rest\n     are fallbacks for printing straight from a browser on a machine that does\n     not have Noto — macOS, Windows and iPadOS each get a real Korean face\n     rather than a tofu grid. */\n  --font-sans:  \"Noto Sans CJK KR\", \"Noto Sans KR\", \"Apple SD Gothic Neo\",\n                \"Malgun Gothic\", \"맑은 고딕\", Pretendard, system-ui, sans-serif;\n  --font-serif: \"Noto Serif CJK KR\", \"Noto Serif KR\", \"Apple SD Gothic Neo\",\n                \"Batang\", Georgia, serif;\n  --font-mono:  \"Noto Sans Mono CJK KR\", ui-monospace, SFMono-Regular, Menlo, monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: 9.5pt;\n  line-height: 1.45;\n  color: var(--ink);\n  background: #fff;\n  font-feature-settings: \"tnum\" 1;\n  /* Hangul must break between words, not mid-word. Without keep-all Chromium\n     breaks Korean at any syllable, which is what makes machine-set Korean look\n     broken. break-word is the escape hatch for long unbreakable Latin tokens. */\n  word-break: keep-all;\n  overflow-wrap: break-word;\n}\n\n/* --- page scaffolding ---------------------------------------------------- */\n\n.page { break-after: page; }\n.page:last-child { break-after: auto; }\n.page.land { page: land; }\n\n.eyebrow {\n  font-size: 7.5pt;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--accent);\n}\n\n.page-head {\n  border-bottom: 1.6pt solid var(--ink);\n  padding-bottom: 2.5mm;\n  margin-bottom: 5mm;\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 6mm;\n}\n.page-head .title {\n  font-family: var(--font-serif);\n  font-size: 16pt;\n  font-weight: 700;\n  line-height: 1.2;\n  margin: 1mm 0 0;\n  letter-spacing: -.01em;\n}\n.page-head .sub { font-size: 8.5pt; color: var(--muted); margin-top: 1mm; }\n.page-head .rhs { text-align: right; font-size: 8pt; color: var(--muted); white-space: nowrap; }\n\nh2.section {\n  font-size: 10.5pt;\n  font-weight: 700;\n  margin: 6mm 0 2.5mm;\n  padding-bottom: 1.2mm;\n  border-bottom: .8pt solid var(--rule);\n  letter-spacing: .01em;\n  break-after: avoid;\n}\nh2.section:first-of-type { margin-top: 0; }\nh2.section .hint { font-weight: 400; color: var(--muted); font-size: 8pt; margin-left: 2mm; }\n\n.block { break-inside: avoid; margin-bottom: 5mm; }\n\n/* --- generic tables ------------------------------------------------------ */\n\ntable { border-collapse: collapse; width: 100%; }\nthead { display: table-header-group; }\ntr { break-inside: avoid; }\n\nth, td {\n  border: .6pt solid var(--rule);\n  padding: 1.6mm 2mm;\n  vertical-align: top;\n  text-align: left;\n}\nthead th {\n  background: var(--tint-2);\n  font-size: 8.5pt;\n  font-weight: 700;\n  line-height: 1.25;\n}\ntd { font-size: 9pt; }\n\n/* --- meta / definition grid ---------------------------------------------- */\n\n.meta {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 0;\n  border-top: .6pt solid var(--rule);\n  border-left: .6pt solid var(--rule);\n}\n.meta.two { grid-template-columns: repeat(2, 1fr); }\n.meta > div {\n  border-right: .6pt solid var(--rule);\n  border-bottom: .6pt solid var(--rule);\n  padding: 2mm 2.5mm;\n  min-height: 13mm;\n}\n.meta dt {\n  font-size: 7.5pt;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--muted);\n  font-weight: 700;\n  margin: 0 0 1mm;\n}\n.meta dd { margin: 0; font-size: 9.5pt; }\n.meta dd.big { font-size: 13pt; font-family: var(--font-serif); font-weight: 700; }\n.meta dd.fill { min-height: 6mm; border-bottom: .5pt dotted var(--hair); }\n\n/* --- the Exam Matrix ----------------------------------------------------- */\n\n.matrix { font-size: 9.5pt; }\n.matrix caption { caption-side: top; text-align: left; }\n\n.matrix thead .mx-title th {\n  background: var(--ink);\n  color: #fff;\n  font-size: 9pt;\n  letter-spacing: .04em;\n  padding: 1.8mm 2mm;\n  border-color: var(--ink);\n}\n.matrix thead .mx-title .cont {\n  float: right;\n  font-weight: 400;\n  opacity: .8;\n  font-size: 8pt;\n}\n.matrix thead .mx-cols th { vertical-align: bottom; }\n.matrix th.rowlab, .matrix td.rowlab {\n  background: var(--tint-1);\n  font-weight: 700;\n  font-size: 9.5pt;\n}\n.matrix td.rowlab .sub {\n  display: block;\n  font-weight: 400;\n  font-size: 8pt;\n  color: var(--muted);\n  margin-top: .6mm;\n}\n.matrix tbody tr { height: 9mm; }\n\n/* marker chip in the column header */\n.chip {\n  display: inline-block;\n  font-family: var(--font-mono);\n  font-size: 6.5pt;\n  letter-spacing: .08em;\n  font-weight: 700;\n  border: .5pt solid var(--ink-2);\n  border-radius: .6mm;\n  padding: 0 .8mm;\n  margin-bottom: 1mm;\n  color: var(--ink-2);\n  background: #fff;\n  white-space: nowrap;\n}\n\n/* cell markers — border style + tint + sigil, never colour alone */\ntd.m-distinction { background: var(--tint-2);  border-left: 2.2pt solid var(--ink-2); }\ntd.m-exception   { background: var(--tint-exc); border-left: 2.2pt double var(--ink-2); }\ntd.m-trap        { background: var(--tint-trap); border-left: 2.8pt solid var(--ink); }\ntd.m-update      { border-left: 2.2pt dotted var(--ink-2); }\ntd.m-evidence    { font-family: var(--font-mono); font-size: 8pt; }\n\n.sigil {\n  font-size: 7.5pt;\n  margin-right: .8mm;\n  color: var(--ink-2);\n}\n.cell-note {\n  display: block;\n  margin-top: .8mm;\n  padding-top: .8mm;\n  border-top: .4pt dotted var(--rule);\n  font-size: 7.5pt;\n  color: var(--muted);\n}\n\n.legend {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 1.5mm 4mm;\n  font-size: 7.5pt;\n  color: var(--ink-2);\n  margin-top: 2.5mm;\n}\n.legend span { white-space: nowrap; }\n.legend b { font-family: var(--font-mono); font-size: 6.5pt; letter-spacing: .06em; }\n\n/* --- recall edition ------------------------------------------------------ */\n\n.matrix.recall tbody tr { height: 16mm; }\ntd.blank {\n  background: repeating-linear-gradient(\n    to bottom, transparent 0, transparent 6.8mm, var(--hair) 6.8mm, var(--hair) 7mm);\n  position: relative;\n}\n.blank-tag {\n  display: inline-block;\n  font-family: var(--font-mono);\n  font-size: 6.5pt;\n  font-weight: 700;\n  line-height: 1.5;\n  min-width: 4.4mm;\n  text-align: center;\n  border: .6pt solid var(--ink-2);\n  border-radius: .5mm;\n  padding: 0 .5mm;\n  color: var(--ink-2);\n  background: #fff;\n}\n.blank-diff {\n  float: right;\n  font-size: 6pt;\n  letter-spacing: .06em;\n  color: var(--muted);\n}\n\n.lines {\n  background-image: repeating-linear-gradient(\n    to bottom, transparent 0, transparent 7.3mm, var(--hair) 7.3mm, var(--hair) 7.5mm);\n  min-height: 22.5mm;\n}\n.lines.tall { min-height: 37.5mm; }\n.lines.short { min-height: 15mm; }\n\n/* --- one-sentence model & essentials ------------------------------------- */\n\n.one-sentence {\n  border: 1pt solid var(--ink);\n  padding: 3mm;\n  background: var(--tint-1);\n}\n.one-sentence .prompt {\n  font-size: 8pt;\n  color: var(--ink-2);\n  margin-bottom: 2mm;\n  font-style: italic;\n}\n.one-sentence .answer { font-size: 10.5pt; font-family: var(--font-serif); line-height: 1.5; }\n\nol.essentials { margin: 0; padding: 0; list-style: none; counter-reset: e; }\nol.essentials li {\n  counter-increment: e;\n  display: flex;\n  gap: 2.5mm;\n  padding: 2mm 0 6mm;\n  border-bottom: .5pt dotted var(--hair);\n  min-height: 14mm;\n}\nol.essentials li::before {\n  content: counter(e);\n  font-family: var(--font-mono);\n  font-size: 8pt;\n  font-weight: 700;\n  color: #fff;\n  background: var(--ink-2);\n  width: 4.5mm; height: 4.5mm;\n  flex: 0 0 4.5mm;\n  border-radius: 50%;\n  text-align: center;\n  line-height: 4.5mm;\n  margin-top: .4mm;\n}\n\n/* --- how-to strip (shown on simple documents in place of the cycle) ------- */\n\nol.howto { margin: 0; padding: 0; list-style: none; counter-reset: h; }\nol.howto li {\n  counter-increment: h;\n  position: relative;\n  padding: 2mm 0 2mm 8mm;\n  border-bottom: .5pt dotted var(--hair);\n  font-size: 10pt;\n}\nol.howto li::before {\n  content: counter(h);\n  position: absolute; left: 0; top: 2.2mm;\n  width: 5mm; height: 5mm;\n  font-family: var(--font-mono); font-size: 8pt; font-weight: 700;\n  color: #fff; background: var(--ink-2); border-radius: 50%;\n  text-align: center; line-height: 5mm;\n}\n\n/* --- decisive distinction panel ------------------------------------------ */\n\n.decisive {\n  border: 1.6pt solid var(--ink);\n  padding: 3.5mm;\n}\n.decisive .q {\n  font-family: var(--font-serif);\n  font-size: 10.5pt;\n  line-height: 1.45;\n  font-style: italic;\n  padding-bottom: 2.5mm;\n  margin-bottom: 2.5mm;\n  border-bottom: .6pt solid var(--rule);\n}\n.decisive .a { font-size: 10pt; font-weight: 500; }\n\n/* --- compression ladder -------------------------------------------------- */\n\n.ladder { display: flex; gap: 3mm; margin-bottom: 5mm; }\n.ladder > div {\n  flex: 1;\n  border: .6pt solid var(--rule);\n  border-top: 2.5pt solid var(--ink);\n  padding: 2.5mm;\n}\n.ladder .lv { font-family: var(--font-mono); font-size: 8pt; font-weight: 700; }\n.ladder .nm { font-size: 8.5pt; font-weight: 700; margin: .8mm 0; }\n.ladder .ds { font-size: 7.5pt; color: var(--muted); line-height: 1.35; }\n\nul.l3 { margin: 0; padding: 0; list-style: none; column-count: 2; column-gap: 8mm; }\nul.l3 li {\n  break-inside: avoid;\n  padding: 1.8mm 0 1.8mm 5mm;\n  border-bottom: .5pt dotted var(--hair);\n  font-size: 9.5pt;\n  position: relative;\n}\nul.l3 li::before {\n  content: \"\";\n  position: absolute; left: 0; top: 2.6mm;\n  width: 3mm; height: 3mm;\n  border: .7pt solid var(--ink-2);\n}\n\n/* --- review tracker (deliberately understated) --------------------------- */\n\n.review td, .review th { text-align: center; font-size: 8.5pt; }\n.review td:first-child, .review th:first-child { text-align: left; }\n.review tbody td:not(:first-child) { height: 8mm; background: var(--tint-1); }\n\n/* --- misc ---------------------------------------------------------------- */\n\n.note {\n  font-size: 8pt;\n  color: var(--muted);\n  line-height: 1.4;\n  border-left: 2pt solid var(--hair);\n  padding-left: 2.5mm;\n  margin: 2.5mm 0;\n}\n.pill {\n  display: inline-block;\n  font-family: var(--font-mono);\n  font-size: 7pt;\n  font-weight: 700;\n  letter-spacing: .06em;\n  border: .6pt solid var(--ink-2);\n  padding: .2mm 1.2mm;\n  border-radius: .6mm;\n}\n.pill.a { background: var(--ink); color: #fff; border-color: var(--ink); }\n.pill.b { background: var(--tint-2); }\n.pill.wide { white-space: nowrap; letter-spacing: 0; }\n\ntd.nowrap, th.nowrap { white-space: nowrap; }\n\n/* Space the learner fills in themselves — the \"self\" in 셀프엑셀표. */\n.own {\n  margin-top: 4mm;\n  border: .6pt solid var(--rule);\n  border-top: 1.6pt solid var(--ink);\n  padding: 2mm 2.5mm 0;\n  break-inside: avoid;\n}\n.own .lines { min-height: 18mm; }\n.own .lbl {\n  font-size: 7.5pt;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  font-weight: 700;\n  color: var(--ink-2);\n  margin-bottom: 1.5mm;\n}\n\n.tags { font-size: 8.5pt; color: var(--ink-2); }\n.tags b { font-weight: 700; }\n\n.kv { font-size: 8.5pt; margin: 0 0 1.2mm; }\n.kv b { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 7.5pt; letter-spacing: .05em; }\n\n.answer-key { column-count: 2; column-gap: 8mm; font-size: 8.5pt; }\n.answer-key .ak-topic { break-inside: avoid-column; margin-bottom: 3.5mm; }\n.answer-key h3 {\n  font-size: 9pt; margin: 0 0 1.5mm; padding-bottom: .8mm;\n  border-bottom: .8pt solid var(--ink);\n}\n.answer-key ol { margin: 0; padding: 0; list-style: none; }\n.answer-key li { padding: .8mm 0; border-bottom: .4pt dotted var(--hair); line-height: 1.35; }\n.answer-key .n {\n  display: inline-block;\n  font-family: var(--font-mono); font-weight: 700; font-size: 6.5pt;\n  min-width: 4.4mm; text-align: center;\n  border: .6pt solid var(--ink-2); border-radius: .5mm; padding: 0 .5mm;\n  color: var(--ink-2);\n}\n.answer-key .w { color: var(--muted); font-size: 7.5pt; }\n\n.toc { font-size: 9pt; }\n.toc td:first-child { font-family: var(--font-mono); font-size: 8pt; width: 12mm; }\n" };
})();
</script>
<script>
"use strict";
/* =========================================================================
   시험표 만들기 — 브라우저 하나로 입력부터 PDF까지.
   Node, 터미널, 설치 없음. file:// 에서도 동작.
   ========================================================================= */

/* 화면에 보이는 표시는 4가지로 줄였다. 데이터는 6가지를 그대로 유지하되
   (update/evidence 는 전체 모드에서만), 처음 쓰는 사람이 고를 것은 4개면 충분하다. */
const MARK_CYCLE = ["core", "distinction", "exception", "trap"];
const MARK_KO = {
  core: "기본", distinction: "갈림", exception: "예외",
  trap: "함정", update: "개정", evidence: "근거",
};
const MARK_HELP = {
  core: "그냥 사실", distinction: "여기서 갈린다", exception: "원칙이 안 통하는 곳",
  trap: "시험이 함정을 파는 곳", update: "바뀔 수 있음", evidence: "기출 표현",
};
const ALL_MARKS = ["core", "distinction", "exception", "trap", "update", "evidence"];

/* 시험 종류별 추천 비교 기준. src/pdf/lib/archetypes.js 와 같은 내용을 쉬운 말로. */
const PRESETS = [
  { id: "concept", name: "개념 · 이론", eg: "사회, 윤리, 경영학",
    cols: ["뜻", "핵심 특징", "갈리는 점", "예외", "함정"] },
  { id: "law", name: "법 · 규정", eg: "행정법, 공무원 시험",
    cols: ["근거 조문", "요건", "효과", "기간", "예외"] },
  { id: "calculation", name: "계산 · 공식", eg: "수학, 물리, 재무",
    cols: ["무엇을 구하나", "변수 · 단위", "쓰는 상황", "자주 하는 실수", "비슷한 공식"] },
  { id: "it", name: "IT · 컴퓨터", eg: "정보처리기사, 네트워크",
    cols: ["용도", "동작 방식", "결과", "한계", "시험 함정"] },
  { id: "language", name: "어학 · 단어", eg: "영어, 한자, 문법",
    cols: ["뜻", "쓰임", "어감", "비슷한 말", "자주 틀리는 것"] },
  { id: "procedure", name: "절차 · 실기", eg: "실기시험, 실습",
    cols: ["언제 하나", "순서", "확인할 것", "실패 상황", "감독관 함정"] },
];

const QUICK_COLS = ["뜻", "특징", "차이점", "예외", "함정", "예시", "조건", "순서", "장점", "단점"];

const ETYPES = ["knowledge-gap", "confused-pair", "exception-forgotten", "wording-misread",
  "formula-selection", "calculation", "procedure-order", "outdated", "careless", "time-pressure"];
const ETYPE_KO = {
  "knowledge-gap": "아예 몰랐음", "confused-pair": "둘을 헷갈림",
  "exception-forgotten": "예외를 까먹음", "wording-misread": "문제를 잘못 읽음",
  "formula-selection": "공식을 잘못 고름", "calculation": "계산 실수",
  "procedure-order": "순서를 틀림", "outdated": "옛날 내용으로 앎",
  "careless": "실수", "time-pressure": "시간 부족",
};

const STEPS = ["시작", "시험", "헷갈리는 것", "비교 기준", "표 채우기", "완성"];

/* ------------------------------------------------------------------ state */

const blankTopic = () => ({
  id: "", title: "", archetype: "concept", importance: "A", frequency: "", why: "",
  core_question: "", key_axis: "", prerequisites: "", sources: "", updated: "",
  one_sentence: "", essentials: ["", "", "", "", ""],
  matrix: { row_label: "", note: "", columns: [], rows: [] },
  decisive: { answer: "", pairs: [] },
  traps: [], evidence: [],
});

const blankState = () => ({
  exam: {
    name: "", name_sub: "", lang: "ko", authority: "", date: "", passing: "",
    syllabus_version: "", target_score: "", confidence: "", last_updated: "",
    subjects: "", sources: "", what_it_tests: "",
    blueprint: [], high_yield: "", weak: "", volatile: "",
  },
  topics: [],
  error_log: [],
  compression: { l2: [], l3: "" },
  ui: { step: 0, mode: "easy", topic: 0 },
  open: {},
});

let S = load() || blankState();
if (!S.ui) S.ui = { step: 0, mode: "easy", topic: 0 };
if (!S.topics) S.topics = [];

function load() {
  try { const r = localStorage.getItem("em.v2"); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem("em.v2", JSON.stringify(S)); flash("자동 저장됨"); } catch (e) {}
  }, 350);
}
function flash(m) {
  const el = document.getElementById("msg");
  el.textContent = m;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => (el.textContent = ""), 1800);
}

const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const slug = (s) => String(s || "").toLowerCase().normalize("NFKD")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const splitLines = (s) => String(s || "").split("\n").map((x) => x.trim()).filter(Boolean);
const splitCommas = (s) => String(s || "").split(",").map((x) => x.trim()).filter(Boolean);
const cur = () => S.topics[S.ui.topic] || S.topics[0];

/* --------------------------------------------------------------- YAML out */

function needsQuote(s) {
  if (s === "") return true;
  if (/^[\s]|[\s]$/.test(s)) return true;
  if (/^[-?:,\[\]{}#&*!|>'"%@`]/.test(s)) return true;
  if (/:\s/.test(s) || /\s#/.test(s)) return true;
  if (/^(true|false|null|yes|no|on|off|~)$/i.test(s)) return true;
  if (/^[-+]?[0-9.]+([eE][-+]?\d+)?$/.test(s)) return true;
  return false;
}
function sc(v) {
  const s = String(v ?? "");
  if (!needsQuote(s)) return s;
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}
function scalar(v, indent) {
  const s = String(v ?? "");
  if (s.length <= 78 && !s.includes("\n")) return sc(s);
  const pad = " ".repeat(indent);
  const words = s.replace(/\s+/g, " ").trim().split(" ");
  const out = []; let line = "";
  for (const w of words) {
    if ((line + " " + w).trim().length > 74) { out.push(line.trim()); line = w; }
    else line += " " + w;
  }
  if (line.trim()) out.push(line.trim());
  return ">-\n" + out.map((l) => pad + l).join("\n");
}
const listOf = (arr, indent) => arr.length
  ? "\n" + arr.map((x) => " ".repeat(indent) + "- " + sc(x)).join("\n") : " []";

function buildYaml() {
  const e = S.exam, L = [];
  const lang = e.lang === "en" ? "en" : "ko";
  L.push("# " + (e.name || "시험표"));
  L.push("# legacy/editor/editor.html 에서 생성됨");
  L.push("");
  L.push("exam:");
  L.push("  name: " + sc(e.name || "제목 없는 시험"));
  if (e.name_sub) L.push("  name_sub: " + sc(e.name_sub));
  L.push("  lang: " + lang);
  if (e.authority) L.push("  authority: " + sc(e.authority));
  if (e.date) L.push("  date: " + sc(e.date));
  if (e.syllabus_version) L.push("  syllabus_version: " + sc(e.syllabus_version));
  if (e.passing) L.push("  passing: " + sc(e.passing));
  if (e.target_score !== "") L.push("  target_score: " + sc(e.target_score));
  if (e.confidence) L.push("  confidence: " + Number(e.confidence));
  if (e.last_updated) L.push("  last_updated: " + sc(e.last_updated));
  L.push("  subjects:" + listOf(splitLines(e.subjects), 4));
  L.push("  sources:" + listOf(splitLines(e.sources), 4));
  const wt = splitLines(e.what_it_tests);
  if (wt.length) L.push("  what_it_tests:" + listOf(wt, 4));
  if (e.blueprint.length) {
    L.push("  blueprint:");
    for (const b of e.blueprint) {
      L.push("    - domain: " + sc(b.domain || "영역"));
      if (b.weight !== "") L.push("      weight: " + (isNaN(Number(b.weight)) ? sc(b.weight) : Number(b.weight)));
      if (b.question_type) L.push("      question_type: " + sc(b.question_type));
      if (b.priority) L.push("      priority: " + b.priority);
      if (b.confidence) L.push("      confidence: " + Number(b.confidence));
      if (b.last_review) L.push("      last_review: " + sc(b.last_review));
    }
  }
  L.push("  high_yield:" + listOf(splitLines(e.high_yield), 4));
  L.push("  weak:" + listOf(splitLines(e.weak), 4));
  L.push("  volatile:" + listOf(splitLines(e.volatile), 4));
  L.push("");
  L.push("topics:");

  S.topics.forEach((tp, ti) => {
    const id = tp.id || slug(tp.title) || ("topic-" + (ti + 1));
    L.push("  - id: " + id);
    L.push("    title: " + sc(tp.title || ("주제 " + (ti + 1))));
    L.push("    archetype: " + tp.archetype);
    if (tp.importance) L.push("    importance: " + tp.importance);
    if (tp.frequency) L.push("    frequency: " + sc(tp.frequency));
    if (tp.why) L.push("    why: " + scalar(tp.why, 6));
    if (tp.core_question) L.push("    core_question: " + sc(tp.core_question));
    if (tp.key_axis) L.push("    key_axis: " + sc(tp.key_axis));
    const pre = splitCommas(tp.prerequisites);
    if (pre.length) L.push("    prerequisites: [" + pre.map(sc).join(", ") + "]");
    const src = splitCommas(tp.sources);
    if (src.length) L.push("    sources: [" + src.map(sc).join(", ") + "]");
    if (tp.updated) L.push("    updated: " + sc(tp.updated));
    if (tp.one_sentence) L.push("    one_sentence: " + scalar(tp.one_sentence, 6));
    const ess = tp.essentials.map((x) => String(x || "").trim()).filter(Boolean).slice(0, 5);
    if (ess.length) L.push("    essentials:" + listOf(ess, 6));

    L.push("");
    L.push("    matrix:");
    if (tp.matrix.row_label) L.push("      row_label: " + sc(tp.matrix.row_label));
    if (tp.matrix.note) L.push("      note: " + sc(tp.matrix.note));
    L.push("      columns:");
    tp.matrix.columns.forEach((c, ci) => {
      const label = c.label_ko || c.label || ("기준 " + (ci + 1));
      const parts = ["key: " + c.key];
      if (lang === "ko") { parts.push("label_ko: " + sc(label)); if (c.label) parts.push("label: " + sc(c.label)); }
      else { parts.push("label: " + sc(c.label || label)); }
      parts.push("mark: " + (c.mark || "core"));
      L.push("        - { " + parts.join(", ") + " }");
    });
    L.push("      rows:");
    tp.matrix.rows.forEach((r, ri) => {
      L.push("        - label: " + sc(r.label || ("항목 " + (ri + 1))));
      if (r.sub) L.push("          sub: " + sc(r.sub));
      const filled = tp.matrix.columns.filter((c) => {
        const cell = r.cells[c.key]; return cell && String(cell.v || "").trim();
      });
      if (filled.length) {
        L.push("          cells:");
        filled.forEach((c) => {
          const cell = r.cells[c.key];
          const v = String(cell.v).trim();
          if (cell.mark && cell.mark !== c.mark) {
            L.push("            " + c.key + ": { v: " + sc(v) + ", mark: " + cell.mark + " }");
          } else {
            L.push("            " + c.key + ": " + sc(v));
          }
        });
      }
    });

    const d = tp.decisive;
    if (d.answer || d.pairs.length) {
      L.push("");
      L.push("    decisive:");
      if (d.answer) L.push("      answer: " + scalar(d.answer, 8));
      if (d.pairs.length) {
        L.push("      pairs:");
        d.pairs.forEach((p) => {
          L.push("        - a: " + sc(p.a || "A"));
          L.push("          b: " + sc(p.b || "B"));
          if (p.why) L.push("          why: " + sc(p.why));
          if (p.clue) L.push("          clue: " + sc(p.clue));
        });
      }
    }
    if (tp.traps.length) {
      L.push("");
      L.push("    traps:");
      tp.traps.forEach((x) => {
        L.push("      - cue: " + sc(x.cue || "진술"));
        if (x.usually) L.push("        usually: " + sc(x.usually));
        if (x.exception) L.push("        exception: " + sc(x.exception));
        if (x.why) L.push("        why: " + sc(x.why));
        if (x.source) L.push("        source: " + sc(x.source));
      });
    }
    if (tp.evidence.length) {
      L.push("");
      L.push("    evidence:");
      tp.evidence.forEach((x) => {
        if (x.row && x.column) L.push("      - cell: { row: " + sc(x.row) + ", column: " + x.column + " }");
        else L.push("      - source: " + sc(x.source || ""));
        if (x.row && x.column && x.source) L.push("        source: " + sc(x.source));
        if (x.exam) L.push("        exam: " + sc(x.exam));
        if (x.question) L.push("        question: " + sc(x.question));
        if (x.tested_as) L.push("        tested_as: " + sc(x.tested_as));
        if (x.risk) L.push("        risk: " + x.risk);
      });
    }
    L.push("");
  });

  if (S.error_log.length) {
    L.push("error_log:");
    S.error_log.forEach((x) => {
      L.push("  - date: " + sc(x.date || ""));
      if (x.question) L.push("    question: " + sc(x.question));
      if (x.topic) L.push("    topic: " + sc(x.topic));
      if (x.mine) L.push("    mine: " + sc(x.mine));
      if (x.correct) L.push("    correct: " + sc(x.correct));
      if (x.error_type) L.push("    error_type: " + x.error_type);
      if (x.missing_distinction) L.push("    missing_distinction: " + sc(x.missing_distinction));
      if (x.mt && x.mrow && x.mcol)
        L.push("    matrix_update: { topic: " + x.mt + ", row: " + sc(x.mrow) + ", column: " + x.mcol + " }");
      if (x.retest) L.push("    retest: " + sc(x.retest));
    });
    L.push("");
  }

  const l3 = splitLines(S.compression.l3);
  if (S.compression.l2.length || l3.length) {
    L.push("compression:");
    if (S.compression.l2.length) {
      L.push("  l2:");
      S.compression.l2.forEach((x) => {
        L.push("    - item: " + sc(x.item || "항목"));
        if (x.detail) L.push("      detail: " + sc(x.detail));
        if (x.mark) L.push("      mark: " + x.mark);
      });
    } else L.push("  l2: []");
    L.push("  l3:" + listOf(l3, 4));
    L.push("");
  }
  L.push("blank_rows:");
  L.push("  error_log: 9");
  return L.join("\n") + "\n";
}

/* ---------------------------------------------------------------- YAML in */

function importYaml(text) {
  const d = jsyaml.load(text);
  if (!d || !d.exam) throw new Error("exam: 항목을 찾을 수 없습니다");
  const e = d.exam;
  const st = blankState();
  st.exam = {
    name: e.name || "", name_sub: e.name_sub || "", lang: e.lang === "en" ? "en" : "ko",
    authority: e.authority || "", date: e.date || "", passing: e.passing || "",
    syllabus_version: e.syllabus_version || "", target_score: e.target_score ?? "",
    confidence: e.confidence || "", last_updated: e.last_updated || "",
    subjects: (e.subjects || []).join("\n"), sources: (e.sources || []).join("\n"),
    what_it_tests: (e.what_it_tests || []).join("\n"),
    blueprint: (e.blueprint || []).map((b) => ({
      domain: b.domain || "", weight: b.weight ?? "", question_type: b.question_type || "",
      priority: b.priority || "", confidence: b.confidence || "", last_review: b.last_review || "" })),
    high_yield: (e.high_yield || []).join("\n"), weak: (e.weak || []).join("\n"),
    volatile: (e.volatile || []).join("\n"),
  };
  st.topics = (d.topics || []).map((tp) => {
    const m = tp.matrix || {};
    const cols = (m.columns || []).map((c) => ({
      key: c.key, label: c.label || "", label_ko: c.label_ko || "", mark: c.mark || "core" }));
    const rows = (m.rows || []).map((r) => {
      const cells = {};
      for (const c of cols) {
        const raw = (r.cells || {})[c.key];
        if (raw === undefined || raw === null) { cells[c.key] = { v: "", mark: c.mark }; continue; }
        if (typeof raw === "object") cells[c.key] = { v: String(raw.v ?? raw.value ?? ""), mark: raw.mark || c.mark };
        else cells[c.key] = { v: String(raw), mark: c.mark };
      }
      return { label: r.label || "", sub: r.sub || "", cells };
    });
    const ess = (tp.essentials || []).slice(0, 5);
    while (ess.length < 5) ess.push("");
    return {
      id: tp.id || "", title: tp.title || "",
      archetype: PRESETS.some((p) => p.id === tp.archetype) ? tp.archetype : "concept",
      importance: tp.importance || "A", frequency: tp.frequency || "", why: tp.why || "",
      core_question: tp.core_question || "", key_axis: tp.key_axis || "",
      prerequisites: (tp.prerequisites || []).join(", "), sources: (tp.sources || []).join(", "),
      updated: tp.updated || "", one_sentence: tp.one_sentence || "", essentials: ess,
      matrix: { row_label: m.row_label || "", note: m.note || "", columns: cols, rows: rows },
      decisive: {
        answer: (tp.decisive || {}).answer || "",
        pairs: ((tp.decisive || {}).pairs || []).map((p) => ({
          a: p.a || "", b: p.b || "", why: p.why || "", clue: p.clue || "" })) },
      traps: (tp.traps || []).map((x) => ({
        cue: x.cue || "", usually: x.usually || "", exception: x.exception || "",
        why: x.why || "", source: x.source || "" })),
      evidence: (tp.evidence || []).map((x) => ({
        row: (x.cell || {}).row || "", column: (x.cell || {}).column || "",
        source: x.source || "", exam: x.exam || "", question: x.question || "",
        tested_as: x.tested_as || "", risk: x.risk || "" })),
    };
  });
  if (!st.topics.length) st.topics = [blankTopic()];
  st.error_log = (d.error_log || []).map((x) => ({
    date: x.date || "", question: x.question || "", topic: x.topic || "",
    mine: x.mine || "", correct: x.correct || "", error_type: x.error_type || "",
    missing_distinction: x.missing_distinction || "",
    mt: (x.matrix_update || {}).topic || "", mrow: (x.matrix_update || {}).row || "",
    mcol: (x.matrix_update || {}).column || "", retest: x.retest || "" }));
  st.compression = {
    l2: ((d.compression || {}).l2 || []).map((x) => ({
      item: x.item || "", detail: x.detail || "", mark: x.mark || "" })),
    l3: (((d.compression || {}).l3) || []).join("\n"),
  };
  st.ui = { step: 5, mode: S.ui.mode, topic: 0 };
  S = st;
  render(); save();
}

/* ------------------------------------------------------- document + print */

/** Builds the same model the Node build produces, from the same YAML text. */
function makeModel(edition) {
  const raw = ExamMatrix.stripEmpty(jsyaml.load(buildYaml()));
  const m = ExamMatrix.normalizeExam(raw);
  if (edition !== "full") ExamMatrix.applyRecall(m);
  return m;
}
function makeHtml(edition) {
  return ExamMatrix.renderDocument(makeModel(edition), edition, ExamMatrix.CSS);
}

const ED_NAME = { full: "전체본", recall: "빈칸 문제지", key: "정답지" };

function printEdition(edition) {
  let html;
  try { html = makeHtml(edition); }
  catch (err) { alert("만들 수 없습니다:\n" + err.message); return; }

  const f = document.createElement("iframe");
  f.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0";
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(html); d.close();
  const go = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { alert("인쇄 창을 열지 못했습니다. 미리보기에서 인쇄해 주세요."); }
    setTimeout(() => f.remove(), 60000);
  };
  // Give the browser a beat to lay the document out before the print dialog.
  if (d.readyState === "complete") setTimeout(go, 400); else f.onload = () => setTimeout(go, 400);
  flash(ED_NAME[edition] + " 인쇄 창을 열었습니다");
}

function preview(edition) {
  let html;
  try { html = makeHtml(edition); }
  catch (err) { alert("만들 수 없습니다:\n" + err.message); return; }
  document.getElementById("modalTitle").textContent = ED_NAME[edition] + " 미리보기";
  document.getElementById("modalPre").style.display = "none";
  const fr = document.getElementById("modalFrame");
  fr.style.display = "";
  fr.srcdoc = html;
  document.getElementById("modalPrint").style.display = "";
  document.getElementById("modalPrint").onclick = () => printEdition(edition);
  document.getElementById("modal").classList.remove("hide");
}

function showYaml() {
  document.getElementById("modalTitle").textContent = "저장 파일 (YAML)";
  document.getElementById("modalFrame").style.display = "none";
  const pre = document.getElementById("modalPre");
  pre.style.display = ""; pre.textContent = buildYaml();
  document.getElementById("modalPrint").style.display = "none";
  document.getElementById("modal").classList.remove("hide");
}

function downloadYaml() {
  const name = (slug(S.exam.name) || "시험표") + ".yaml";
  const blob = new Blob([buildYaml()], { type: "text/yaml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash("저장했습니다");
}

function ensureTopic() {
  if (!S.topics.length) S.topics = [blankTopic()];
  if (S.ui.topic >= S.topics.length) S.ui.topic = 0;
  const tp = cur();
  while (tp.matrix.rows.length < 2) tp.matrix.rows.push({ label: "", sub: "", cells: {} });
  return tp;
}

function addColumn(tp, label) {
  let n = tp.matrix.columns.length + 1, key = "c" + n;
  while (tp.matrix.columns.some((c) => c.key === key)) key = "c" + (++n);
  tp.matrix.columns.push({ key, label: "", label_ko: label || "", mark: "core" });
}

/**
 * Re-checks whether the step's Next button should be enabled.
 * Called on every keystroke — a full re-render here would blur the input the
 * learner is still typing into, which is how the button used to stay greyed out
 * even after they had filled the fields in.
 */
function syncGate() {
  const btn = document.querySelector("[data-act=next]");
  if (!btn) return;
  let ok = true;
  if (S.ui.step === 2) ok = validRows();
  if (S.ui.step === 3) ok = cur() && cur().matrix.columns.length > 0;
  btn.disabled = !ok;
  const note = document.getElementById("gateNote");
  if (note) note.style.display = ok ? "none" : "";
}

      value="${esc(c.label_ko)}" placeholder="기준 ${ci + 1}"></th>`).join("");
  const body = tp.matrix.rows.map((r, ri) => {
    const cells = tp.matrix.columns.map((c) => {
      const cell = r.cells[c.key] || (r.cells[c.key] = { v: "", mark: c.mark || "core" });
      const mk = cell.mark || "core";
      const cls = mk !== "core" ? ` class="c-${mk}"` : "";
      return `<td${cls}>
        <textarea data-cell="${S.ui.topic}.${ri}.${c.key}" placeholder="">${esc(cell.v)}</textarea>
        <button class="mkb" data-m="${mk}" data-cyc="${S.ui.topic}.${ri}.${c.key}"
          title="${esc(MARK_HELP[mk])}">${esc(MARK_KO[mk])}</button></td>`;
    }).join("");
    return `<tr><td class="rl">
        <input type="text" data-p="topics.${S.ui.topic}.matrix.rows.${ri}.label"
          value="${esc(r.label)}" placeholder="항목 ${ri + 1}"></td>${cells}</tr>`;
  }).join("");
  return `<div class="gwrap"><table class="g">
      <thead><tr><th class="rl" style="min-width:135px">비교할 것</th>${head}</tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="legend">
      ${MARK_CYCLE.map((m) => `<span><b>${MARK_KO[m]}</b> — ${MARK_HELP[m]}</span>`).join("")}
    </div>
    <div class="nav" style="margin-top:12px;gap:9px">
      <button class="sm" data-act="addrow">＋ 줄 추가</button>
      <button class="sm" data-act="addcol">＋ 기준 추가</button>
    </div>`;
}

/* ------------------------------------------------------------- full mode */

function get(path) {
  return path.split(".").reduce((o, k) => {
    if (o == null) return "";
    return o[/^\d+$/.test(k) ? Number(k) : k];
  }, S) ?? "";
}
function set(path, val) {
  const ks = path.split(".");
  let o = S;
  for (let i = 0; i < ks.length - 1; i++) o = o[/^\d+$/.test(ks[i]) ? Number(ks[i]) : ks[i]];
  const last = ks[ks.length - 1];
  o[/^\d+$/.test(last) ? Number(last) : last] = val;
}
function fld(label, path, type = "text", opts) {
  const v = get(path);
  if (type === "textarea") return `<label class="f"><span>${esc(label)}</span>
    <textarea data-p="${path}">${esc(v)}</textarea></label>`;
  if (type === "select") return `<label class="f"><span>${esc(label)}</span>
    <select data-p="${path}">${opts.map((o) => {
      const [val, txt] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(v) === String(val) ? " selected" : ""}>${esc(txt)}</option>`;
    }).join("")}</select></label>`;
  return `<label class="f"><span>${esc(label)}</span>
    <input type="${type}" data-p="${path}" value="${esc(v)}"></label>`;
}
function card(id, title, count, body) {
  const closed = S.open[id] === false ? " closed" : "";
  return `<section class="card${closed}" data-card="${id}">
    <h2 data-toggle="${id}">${esc(title)}${count != null ? `<span class="cnt">${count}</span>` : ""}
      <span class="tw">${closed ? "▸" : "▾"}</span></h2><div class="body">${body}</div></section>`;
}

/* --------------------------------------------------------------- rendering */

function renderSteps() {
  const el = document.getElementById("steps");
  if (S.ui.mode === "full") { el.style.display = "none"; return; }
  el.style.display = "";
  el.innerHTML = STEPS.map((s, i) => {
    const cls = i === S.ui.step ? "now" : (i < S.ui.step ? "done" : "");
    return `<button class="st ${cls}" data-act="step" data-i="${i}">
      <span class="num">${i < S.ui.step ? "✓" : i}</span>${esc(s)}</button>`;
  }).join("");
}

function render() {
  document.getElementById("mEasy").classList.toggle("on", S.ui.mode === "easy");
  document.getElementById("mFull").classList.toggle("on", S.ui.mode === "full");
  const main = document.getElementById("app");
  main.classList.toggle("wide", S.ui.mode === "full" || S.ui.step === 4);
  renderSteps();
  main.innerHTML = S.ui.mode === "full" ? renderFull() : screens[S.ui.step]();
  const showTools = S.ui.mode === "full" || S.ui.step >= 4;
  document.getElementById("btnPdf").style.display = showTools ? "" : "none";
  document.getElementById("btnPrev").style.display = showTools ? "" : "none";
  document.getElementById("btnYaml").style.display = showTools ? "" : "none";
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* ------------------------------------------------------------------ events */

document.getElementById("app").addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.p) {
    set(el.dataset.p, el.value); save(); syncGate();
    return;
  }
  if (el.dataset.cell) {
    const [ti, ri, key] = el.dataset.cell.split(".");
    S.topics[ti].matrix.rows[ri].cells[key].v = el.value; save();
  }
});
document.getElementById("app").addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.p && /archetype$|exam\.lang$|\.mark$/.test(el.dataset.p)) { render(); save(); }
});

document.getElementById("app").addEventListener("click", (ev) => {
  const tg = ev.target.closest("[data-toggle]");
  if (tg) { const id = tg.dataset.toggle; S.open[id] = S.open[id] === false; render(); save(); return; }
  const b = ev.target.closest("[data-act], [data-cyc]");
  if (!b) return;

  if (b.dataset.cyc) {
    const [ti, ri, key] = b.dataset.cyc.split(".");
    const cell = S.topics[ti].matrix.rows[ri].cells[key];
    const i = MARK_CYCLE.indexOf(cell.mark || "core");
    cell.mark = MARK_CYCLE[(i + 1) % MARK_CYCLE.length];
    render(); save(); return;
  }

  const a = b.dataset.act;
  const i = Number(b.dataset.i);
  const ti = b.dataset.t !== undefined ? Number(b.dataset.t) : S.ui.topic;
  const tp = S.topics[ti];

  switch (a) {
    case "start":     S.topics = [blankTopic()]; S.ui.topic = 0; S.ui.step = 1; break;
    case "sample":    S = sampleState(); break;
    case "loadfile":  document.getElementById("fileIn").click(); return;
    case "next":      S.ui.step = Math.min(5, S.ui.step + 1); break;
    case "back":      S.ui.step = Math.max(0, S.ui.step - 1); break;
    case "step":      S.ui.step = i; break;
    case "mode":      S.ui.mode = b.dataset.v; break;
    case "addrow":    ensureTopic().matrix.rows.push({ label: "", sub: "", cells: {} }); break;
    case "delrow":    ensureTopic().matrix.rows.splice(i, 1); break;
    case "addcol":    addColumn(ensureTopic(), ""); break;
    case "quickcol":  addColumn(ensureTopic(), b.dataset.v); break;
    case "delcol": {
      const t = ensureTopic();
      const [gone] = t.matrix.columns.splice(i, 1);
      t.matrix.rows.forEach((r) => { if (gone) delete r.cells[gone.key]; });
      break;
    }
    case "preset": {
      const p = PRESETS.find((x) => x.id === b.dataset.id);
      const t = ensureTopic();
      const written = t.matrix.rows.some((r) =>
        Object.values(r.cells || {}).some((c) => String(c.v || "").trim()));
      if (written && !confirm("이미 채운 칸이 있습니다. 기준을 바꾸면 지워집니다. 계속할까요?")) return;
      t.archetype = p.id;
      t.matrix.columns = [];
      t.matrix.rows.forEach((r) => { r.cells = {}; });
      p.cols.forEach((c) => addColumn(t, c));
      break;
    }
    case "pdf":       printEdition(b.dataset.ed); return;
    case "prev":      preview(b.dataset.ed || "full"); return;
    case "addtopic":  S.topics.push(blankTopic()); S.ui.topic = S.topics.length - 1; S.ui.step = 2; break;
    case "edittopic": S.ui.topic = i; S.ui.step = 4; S.ui.mode = "easy"; break;
    case "deltopic":
      if (!confirm("이 주제를 지울까요?")) return;
      S.topics.splice(i, 1);
      if (!S.topics.length) S.topics = [blankTopic()];
      S.ui.topic = 0;
      break;
    case "addpair":   tp.decisive.pairs.push({ a: "", b: "", why: "", clue: "" }); break;
    case "delpair":   tp.decisive.pairs.splice(i, 1); break;
    case "addtrap":   tp.traps.push({ cue: "", usually: "", exception: "", why: "", source: "" }); break;
    case "deltrap":   tp.traps.splice(i, 1); break;
    case "addev":     tp.evidence.push({ row: "", column: "", source: "", exam: "", question: "", tested_as: "", risk: "" }); break;
    case "delev":     tp.evidence.splice(i, 1); break;
    case "adddomain": S.exam.blueprint.push({ domain: "", weight: "", question_type: "", priority: "A", confidence: "", last_review: "" }); break;
    case "deldomain": S.exam.blueprint.splice(i, 1); break;
    case "adderr":    S.error_log.push({ date: "", question: "", topic: "", mine: "", correct: "", error_type: "", missing_distinction: "", mt: "", mrow: "", mcol: "", retest: "" }); break;
    case "delerr":    S.error_log.splice(i, 1); break;
    case "addl2":     S.compression.l2.push({ item: "", detail: "", mark: "" }); break;
    case "dell2":     S.compression.l2.splice(i, 1); break;
    default: return;
  }
  render(); save();
});

document.getElementById("mEasy").onclick = () => { S.ui.mode = "easy"; render(); save(); };
document.getElementById("mFull").onclick = () => {
  if (!S.topics.length) S.topics = [blankTopic()];
  S.ui.mode = "full"; render(); save();
};
document.getElementById("btnLoad").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { importYaml(String(r.result)); flash("불러왔습니다"); }
    catch (err) { alert("파일을 읽지 못했습니다:\n" + err.message); } };
  r.readAsText(f, "utf-8");
  ev.target.value = "";
};
document.getElementById("btnPdf").onclick = () => {
  if (S.ui.mode === "easy" && S.ui.step < 5) { S.ui.step = 5; render(); save(); }
  else printEdition("full");
};
document.getElementById("btnPrev").onclick = () => preview("full");
document.getElementById("btnYaml").onclick = () => downloadYaml();
document.getElementById("modalClose").onclick = () => document.getElementById("modal").classList.add("hide");
