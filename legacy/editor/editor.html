<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험표 만들기</title>
<style>
:root{
  --ink:#15181d; --ink-2:#3f454f; --muted:#6d7480; --rule:#c6ccd4; --hair:#e4e8ec;
  --accent:#1f5fa8; --accent-d:#17497f; --bg:#f4f6f8; --panel:#fff;
  --tint:#eef1f5; --good:#1c7a4a; --warn:#8a6d1f;
  --sans:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);
  word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}

/* ---------------------------------------------------------------- top bar */
header.bar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header.bar .logo{font-size:15px;font-weight:800;letter-spacing:-.01em}
header.bar .sp{flex:1}
.tb{background:transparent;border:1px solid #4b535e;color:#fff;border-radius:8px;
  padding:6px 12px;font-size:13px;cursor:pointer}
.tb:hover{background:#272d36}
.tb.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}

/* ------------------------------------------------------------------ steps */
.steps{background:var(--panel);border-bottom:1px solid var(--hair);padding:10px 16px;
  display:flex;gap:6px;overflow-x:auto;position:sticky;top:53px;z-index:55}
.steps .st{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  font-size:13px;color:var(--muted);white-space:nowrap;border:1px solid transparent;
  background:none;cursor:pointer}
.steps .st .num{width:21px;height:21px;border-radius:50%;background:var(--hair);color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 21px}
.steps .st.done{color:var(--ink-2)}
.steps .st.done .num{background:var(--good);color:#fff}
.steps .st.now{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}
.steps .st.now .num{background:#fff;color:var(--accent)}

/* ----------------------------------------------------------------- layout */
main{max-width:900px;margin:0 auto;padding:26px 16px 130px}
main.wide{max-width:1200px}
.screen h1{font-size:27px;line-height:1.3;margin:0 0 8px;letter-spacing:-.02em}
.screen .lede{color:var(--ink-2);margin:0 0 22px;font-size:15.5px}
.screen .lede b{color:var(--ink)}

/* ------------------------------------------------------------------ cards */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.pick{grid-template-columns:1fr}}
.pcard{background:var(--panel);border:2px solid var(--hair);border-radius:14px;padding:22px 18px;
  text-align:left;cursor:pointer;transition:.12s}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,50,.08)}
.pcard .ic{font-size:30px;line-height:1;margin-bottom:12px}
.pcard .t{font-size:17px;font-weight:800;margin-bottom:5px}
.pcard .d{font-size:13.5px;color:var(--muted);line-height:1.5}

/* ----------------------------------------------------------------- fields */
.fld{margin-bottom:20px}
.fld > label{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.fld .help{font-size:13.5px;color:var(--muted);margin:0 0 9px;line-height:1.5}
.fld .help b{color:var(--accent);font-weight:700}
input[type=text],input[type=date],select,textarea{width:100%;border:1.5px solid var(--rule);
  border-radius:9px;padding:12px 13px;background:#fff}
input.big{font-size:19px;padding:15px 16px;font-weight:600}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:3px solid #bcd6f0;outline-offset:-1px;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}}

/* ------------------------------------------------------------- list rows */
.lrow{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.lrow .idx{width:28px;height:28px;border-radius:50%;background:var(--ink-2);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 28px}
.lrow input{flex:1}
.xb{background:#fff;border:1.5px solid var(--rule);color:#8a2b2b;border-radius:8px;
  width:38px;height:44px;flex:0 0 38px;cursor:pointer;font-size:15px}
.xb:hover{background:#fdf2f2;border-color:#d8b0b0}
.addb{background:#fff;border:1.5px dashed var(--rule);border-radius:9px;padding:11px 16px;
  cursor:pointer;color:var(--accent);font-weight:700;font-size:14.5px;width:100%}
.addb:hover{border-color:var(--accent);background:#f7fbff}

/* ------------------------------------------------------------------ chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{background:#fff;border:1.5px solid var(--rule);border-radius:99px;padding:7px 14px;
  font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.set{background:var(--tint);border-style:dashed}

/* ------------------------------------------------------------------- grid */
.gwrap{overflow-x:auto;border:1.5px solid var(--rule);border-radius:11px;background:#fff}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
table.g th,table.g td{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:7px;vertical-align:top}
table.g thead th{background:var(--tint);position:sticky;top:0;z-index:2}
table.g th.rl,table.g td.rl{position:sticky;left:0;background:#f8fafb;min-width:135px;z-index:1}
table.g thead th.rl{z-index:3}
table.g td{min-width:185px}
table.g textarea{min-height:64px;font-size:14.5px;border-color:var(--hair);padding:8px}
table.g input{font-size:14.5px;border-color:var(--hair);padding:8px}
.mkb{margin-top:5px;background:#fff;border:1px solid var(--rule);border-radius:7px;
  padding:3px 9px;font-size:11.5px;cursor:pointer;font-weight:700;color:var(--muted)}
.mkb[data-m=distinction]{background:#eceef2;color:#2c3440;border-color:#a9b2bf}
.mkb[data-m=exception]{background:#f2ede4;color:#6a5629;border-color:#c9b895}
.mkb[data-m=trap]{background:#eae7ec;color:#4a3350;border-color:#b9a8bf}
td.c-distinction{background:#f7f8fa}
td.c-exception{background:#fbf8f3}
td.c-trap{background:#f7f5f8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend b{color:var(--ink-2)}

/* ------------------------------------------------------------------- nav */
.nav{display:flex;gap:11px;margin-top:28px;align-items:center}
.btn{border-radius:10px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--rule);background:#fff}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.pri:disabled{background:#a9bdd4;border-color:#a9bdd4;cursor:not-allowed}
.btn.lg{padding:17px 30px;font-size:17px}
.nav .sp{flex:1}

/* ------------------------------------------------------------------ done */
.dl3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px}
@media(max-width:720px){.dl3{grid-template-columns:1fr}}
.dcard{background:var(--panel);border:2px solid var(--hair);border-radius:14px;padding:20px 18px;
  cursor:pointer;text-align:left;transition:.12s}
.dcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,50,.08)}
.dcard.hero{border-color:var(--accent);background:#f7fbff}
.dcard .ic{font-size:26px;margin-bottom:10px}
.dcard .t{font-size:16px;font-weight:800;margin-bottom:4px}
.dcard .d{font-size:13px;color:var(--muted);line-height:1.5}

.tip{background:#f2f8ff;border:1px solid #cfe2f5;border-radius:11px;padding:14px 16px;
  font-size:14px;color:#1c4570;margin:18px 0}
.tip b{color:#123a63}
.warnbox{background:#fdf7e8;border:1px solid #e7d5a6;border-radius:11px;padding:14px 16px;
  font-size:14px;color:#6b551f;margin:16px 0}

/* --------------------------------------------------------------- foot bar */
.footbar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--rule);
  display:flex;gap:10px;align-items:center;padding:11px 16px;z-index:58}
.footbar .sp{flex:1}
.footbar .msg{font-size:13px;color:var(--muted)}
.footbar .btn{padding:11px 20px;font-size:15px}

/* ----------------------------------------------------------------- modal */
.modal{position:fixed;inset:0;background:rgba(12,16,22,.62);z-index:90;display:flex;
  flex-direction:column;padding:18px}
.modal.hide{display:none}
.modal .mh{display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:12px}
.modal .mh b{font-size:16px}
.modal .mh .sp{flex:1}
.modal iframe{flex:1;width:100%;border:0;border-radius:10px;background:#fff}
.modal pre{flex:1;overflow:auto;background:#12161b;color:#d6dde6;border-radius:10px;
  padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:0;white-space:pre}

/* --------------------------------------------------------------- full mode */
section.card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;margin-bottom:14px}
section.card>h2{margin:0;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--hair)}
section.card>h2 .cnt{font-weight:400;color:var(--muted);font-size:12.5px}
section.card>h2 .tw{margin-left:auto;color:var(--muted);font-size:13px}
section.card>.body{padding:16px}
section.card.closed>.body{display:none}
section.card.closed>h2{border-bottom:none}
.item{border:1px solid var(--hair);border-radius:10px;padding:13px;margin-bottom:11px;background:#fcfdfe}
.item .ih{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.item .ih .n{font-size:12px;font-weight:800;color:#fff;background:var(--ink-2);border-radius:50%;
  width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px}
.item .ih .t{font-weight:700;font-size:14.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{padding:5px 11px;font-size:12.5px;border-radius:7px;border:1px solid var(--rule);background:#fff;cursor:pointer}
.sm.dg{color:#8a2b2b}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:720px){.g3{grid-template-columns:1fr}}
label.f{display:block}
label.f>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
label.f input,label.f select,label.f textarea{padding:9px 11px;font-size:14.5px}
h3.sh{font-size:14px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
</style>
</head>
<body>

<header class="bar">
  <span class="logo">시험표 만들기</span>
  <span class="sp"></span>
  <button class="tb on" id="mEasy">쉬운 모드</button>
  <button class="tb" id="mFull">전체 모드</button>
  <button class="tb" id="btnLoad">불러오기</button>
  <input type="file" id="fileIn" accept=".yaml,.yml" hidden>
</header>

<div class="steps" id="steps"></div>
<main id="app"></main>

<div class="footbar">
  <button class="btn pri" id="btnPdf">📄 시험표 만들기</button>
  <button class="btn" id="btnPrev">미리보기</button>
  <span class="sp"></span>
  <span class="msg" id="msg"></span>
  <button class="sm" id="btnYaml">파일로 저장</button>
</div>

<div class="modal hide" id="modal">
  <div class="mh"><b id="modalTitle"></b><span class="sp"></span>
    <button class="tb" id="modalPrint">인쇄 · PDF 저장</button>
    <button class="tb" id="modalClose">닫기</button></div>
  <iframe id="modalFrame" title="미리보기"></iframe>
  <pre id="modalPre" style="display:none"></pre>
</div>

/**

 * or js-yaml.

/** Display width in half-width units: CJK/Hangul count double. */
function visualLen(s = '') {
  let n = 0;
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    n += (c >= 0x1100 && (
      c <= 0x115f ||
      (c >= 0x2e80 && c <= 0xa4cf) ||
      (c >= 0xac00 && c <= 0xd7a3) ||
      (c >= 0xf900 && c <= 0xfaff) ||

      (c >= 0xff00 && c <= 0xff60) ||
      (c >= 0xffe0 && c <= 0xffe6)

  }
  return n;
}

/* ==== src/pdf/lib/normalize.js ==== */
/**
 * Turns a raw parsed exam object into the shape the templates render.
 *
 * Pure: no fs, no ajv, no js-yaml. That is deliberate — this module is bundled
 * into the browser editor so that typing in the editor and building from a YAML
 * file go through exactly the same normalisation, and the on-screen preview
 * cannot drift from the committed PDFs.
 */


const MAX_ESSENTIALS = 5;

/** Normalise a cell: bare string or {v, mark, note}. */
function normCell(raw, columnMark) {
  if (raw === null || raw === undefined || raw === '') {
    return { v: '', mark: columnMark, empty: true };
  }
  if (typeof raw === 'object') {
    return {
      v: String(raw.v ?? raw.value ?? ''),
      mark: raw.mark ?? columnMark ?? 'core',
      note: raw.note ?? null,
      empty: !(raw.v ?? raw.value),
    };
  }
  return { v: String(raw), mark: columnMark ?? 'core', empty: false };
}

function pickLabel(obj, lang, base = 'label') {
  if (!obj) return '';
  return (lang === 'ko' && obj[`${base}_ko`]) ? obj[`${base}_ko`] : (obj[base] ?? obj[`${base}_ko`] ?? '');
}

function daysBetween(from, to) {
  const a = new Date(from), b = new Date(to);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}

/**
 * `key:` with nothing after it is how a person fills in a template, and YAML
 * reads it as null. Treat that as "not provided" rather than as a type error,
 * so a half-completed file still builds. Objects and array entries left wholly
 * empty are dropped for the same reason.
 */
function stripEmpty(node) {
  if (Array.isArray(node)) {
    return node.map(stripEmpty).filter((v) => v !== null && v !== undefined);
  }
  if (node && typeof node === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(node)) {
      const s = stripEmpty(v);
      if (s === null || s === undefined) continue;
      if (typeof s === 'object' && !Array.isArray(s) && Object.keys(s).length === 0) continue;
      out[k] = s;
    }
    return out;
  }
  return node;
}

function normalizeExam(raw, { today = new Date() } = {}) {
  const warnings = [];
  const lang = raw.exam?.lang === 'ko' ? 'ko' : 'en';
  const exam = { ...(raw.exam ?? {}), lang };
  exam.days_remaining = exam.date ? daysBetween(today, exam.date) : null;
  exam.blueprint = raw.exam?.blueprint ?? [];

  const topics = (raw.topics ?? []).map((t, ti) => {
    const arch = ARCHETYPES[t.archetype];
    if (!arch) throw new Error(`Topic "${t.title}": unknown archetype "${t.archetype}"`);

    const m = t.matrix ?? {};
    const rawCols = m.columns?.length ? m.columns : defaultColumns(t.archetype);
    const columns = rawCols.map((c) => ({
      key: c.key,
      label: pickLabel(c, lang),
      mark: c.mark ?? 'core',
    }));

    const rows = (m.rows ?? []).map((r) => ({
      label: r.label,
      sub: r.sub ?? null,
      cells: columns.map((c) => normCell(r.cells?.[c.key], c.mark)),
    }));

    if ((t.essentials ?? []).length > MAX_ESSENTIALS) {
      warnings.push(
        `Topic "${t.title}": ${t.essentials.length} essentials — the system caps at ` +
        `${MAX_ESSENTIALS} on purpose (P8, structure beats volume). Extra items dropped.`
      );
    }

    return {
      ...t,
      index: ti + 1,
      archetypeLabel: pickLabel(arch, lang),
      essentials: (t.essentials ?? []).slice(0, MAX_ESSENTIALS),
      matrix: {
        row_label: m.row_label ?? archetypeRowLabel(t.archetype, lang),
        note: m.note ?? null,
        layout: m.layout ?? 'auto',
        columns,
        rows,
      },
      decisive: t.decisive ?? null,
      traps: t.traps ?? [],
      evidence: t.evidence ?? [],
    };
  });

  // --- structural error -> matrix cell links -----------------------------
  // This is the load-bearing feedback link (P3). A dangling reference means a
  // mistake was logged against a cell that does not exist, which is a real
  // authoring bug, so we surface it rather than rendering a broken breadcrumb.
  const byId = new Map(topics.map((t) => [t.id, t]));
  const resolveRef = (ref, where, defaultTopicId = null) => {
    if (!ref) return null;
    if (typeof ref === 'string') return { text: ref, resolved: false };
    const topicId = ref.topic ?? defaultTopicId;
    if (!topicId) {
      warnings.push(`${where}: cell reference has no topic and none could be inferred`);
      return { text: `${ref.row ?? ''} · ${ref.column ?? ''}`, resolved: false };
    }
    const t = byId.get(topicId);
    if (!t) {
      warnings.push(`${where}: references unknown topic "${topicId}"`);
      return { text: `${topicId} · ${ref.row ?? ''} · ${ref.column ?? ''}`, resolved: false };
    }
    const row = t.matrix.rows.find((r) => r.label === ref.row);
    const colIdx = t.matrix.columns.findIndex((c) => c.key === ref.column);
    if (!row) warnings.push(`${where}: topic "${topicId}" has no row "${ref.row}"`);
    if (colIdx < 0) warnings.push(`${where}: topic "${topicId}" has no column "${ref.column}"`);
    const colLabel = colIdx >= 0 ? t.matrix.columns[colIdx].label : ref.column;
    return {
      text: [t.title, ref.row, colLabel].filter(Boolean).join(' · '),
      // Same breadcrumb without the topic, for use on that topic's own pages.
      short: [ref.row, colLabel].filter(Boolean).join(' · '),
      resolved: !!row && colIdx >= 0,
      topicIndex: t.index,
    };
  };

  const error_log = (raw.error_log ?? []).map((e, i) => ({
    ...e,
    matrix_update: resolveRef(e.matrix_update, `error_log[${i}]`),
  }));

  topics.forEach((t) => {
    t.evidence = t.evidence.map((ev, i) => ({
      ...ev,
      cellRef: resolveRef(ev.cell, `topic "${t.id}" evidence[${i}]`, t.id),
    }));
  });

  return {
    exam,
    topics,
    error_log,
    compression: raw.compression ?? {},
    blank_rows: raw.blank_rows ?? {},
    warnings,
    lang,
    MARKERS,
    MARKER_DIFFICULTY,
  };
}


/* ==== src/pdf/lib/layout.js ==== */
/**
 * Adaptive matrix layout.
 *
 * The rule the brief insists on and that this implements: never shrink a wide
 * table until it is unreadable. Widen the page first; if that is not enough,
 * split the columns across pages, repeating the row-label column. Font size is
 * never the variable.
 */


/** Millimetres. Derived from the @page margins in src/pdf/print.css. */
const GEOM = {
  portrait:  { usable: 180, rowLabel: 32 },
  landscape: { usable: 271, rowLabel: 34 },
};

/** Minimum comfortable data-column width. Recall cells need room to write in. */
const MIN_COL = { full: 28, recall: 34 };

function maxCols(orientation, edition) {
  const g = GEOM[orientation];
  return Math.max(1, Math.floor((g.usable - g.rowLabel) / MIN_COL[edition]));
}

/** Split n columns into balanced groups of at most `cap`. */
function balancedChunks(columns, cap) {
  const n = columns.length;
  if (n <= cap) return [columns];
  const groups = Math.ceil(n / cap);
  const size = Math.ceil(n / groups);
  const out = [];
  for (let i = 0; i < n; i += size) out.push(columns.slice(i, i + size));
  return out;
}

/**
 * @returns {{orientation, chunks: Array<{columns, index, total}>, density}}
 */
function planMatrix(matrix, edition = 'full') {
  const cols = matrix.columns;
  const rows = matrix.rows;

  // Longest content each column has to hold, in half-width units.
  const perColMax = cols.map((c, ci) =>
    Math.max(visualLen(c.label), ...rows.map((r) => visualLen(r.cells[ci]?.v ?? '')))
  );
  const density = perColMax.length
    ? perColMax.reduce((a, b) => a + b, 0) / perColMax.length
    : 0;

  const capPortrait = maxCols('portrait', edition);
  const capLandscape = maxCols('landscape', edition);

  let orientation;
  if (matrix.layout === 'portrait' || matrix.layout === 'landscape') {
    orientation = matrix.layout;
  } else if (cols.length <= capPortrait && (cols.length <= 3 || density <= 34)) {
    // Few columns, or several short ones: portrait keeps the reading rhythm of
    // the rest of the document and duplex-prints without rotating the page.
    orientation = 'portrait';
  } else {
    orientation = 'landscape';
  }

  const cap = orientation === 'portrait' ? capPortrait : capLandscape;
  const groups = balancedChunks(cols, cap);

  return {
    orientation,
    density: Math.round(density),
    chunks: groups.map((columns, i) => ({
      columns,
      // Column indices into the original row.cells array.
      indices: columns.map((c) => cols.findIndex((x) => x.key === c.key)),
      index: i + 1,
      total: groups.length,
    })),
  };
}

/**
 * Column width percentages for one chunk. Proportional to content need but
 * clamped, so one verbose column cannot starve the others.
 */
function columnWidths(chunk, rows, orientation) {
  const g = GEOM[orientation];
  const labelPct = (g.rowLabel / g.usable) * 100;
  const need = chunk.columns.map((c, i) => {
    const ci = chunk.indices[i];
    const m = Math.max(visualLen(c.label), ...rows.map((r) => visualLen(r.cells[ci]?.v ?? '')));
    return Math.min(Math.max(m, 14), 46); // clamp so nothing dominates
  });
  const total = need.reduce((a, b) => a + b, 0) || 1;
  const rest = 100 - labelPct;
  return {
    label: labelPct.toFixed(2),
    cols: need.map((n) => ((n / total) * rest).toFixed(2)),
  };
}


/* ==== src/pdf/lib/recall.js ==== */
/**
 * Recall Edition generator.
 *
 * Turns the same data structure into a retrieval instrument by withholding
 * cells rather than by maintaining a second document. Row and column labels
 * always survive, so the learner gets cued recall — the grid *is* the cue.
 *
 * Deterministic: the same source file always blanks the same cells, so the
 * answer key stays valid and a reprint matches the copy already written on.
 */


/** Fraction of eligible matrix cells withheld. */
const TARGET_RATIO = 0.45;
/** Never withhold more than this share of one row — some context must remain. */
const MAX_ROW_RATIO = 0.7;

/** Cells carrying a discrimination are worth withholding; boilerplate is not. */
const WEIGHT = { trap: 5, exception: 5, distinction: 4, update: 3, core: 1.5, evidence: 0.5 };

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** mulberry32 — small, deterministic, good enough for choosing cells. */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DIFFICULTY_GLYPH = { high: '●●●', mid: '●●', low: '●' };

/**
 * Annotates a loaded model in place with recall metadata.
 * Adds `blank` + `ref` + `difficulty` to chosen cells, and collects an answer key.
 *
 * @returns {Array<{topic, items: Array<{ref, where, answer, difficulty}>}>}
 */
function applyRecall(model) {
  const key = [];
  let counter = 0;
  const next = () => ++counter;

  for (const t of model.topics) {
    const items = [];
    const rand = rng(hash(`${model.exam.name}::${t.id}`));

    // --- one-sentence model: always withheld ---------------------------------
    if (t.one_sentence) {
      const ref = next();
      t.recall_one_sentence = { ref };
      items.push({
        ref, where: model.lang === 'ko' ? '한 문장 모델' : 'One-sentence model',
        answer: t.one_sentence, difficulty: 'mid',
      });
    }

    // --- matrix cells --------------------------------------------------------
    const rows = t.matrix.rows;
    const candidates = [];
    rows.forEach((r, ri) => {
      r.cells.forEach((c, ci) => {
        if (c.empty || !c.v) return;
        candidates.push({ ri, ci, w: WEIGHT[c.mark] ?? 1, r: rand() });
      });
    });

    // Weighted ordering: high-discrimination cells first, jittered so the sheet
    // does not become "every trap column is blank".
    candidates.sort((a, b) => (b.w + b.r * 2.2) - (a.w + a.r * 2.2));

    const target = Math.round(candidates.length * TARGET_RATIO);
    const perRowCap = rows.map((r) =>
      Math.floor(r.cells.filter((c) => !c.empty && c.v).length * MAX_ROW_RATIO)
    );
    const perRowUsed = rows.map(() => 0);

    let taken = 0;
    for (const cand of candidates) {
      if (taken >= target) break;
      if (perRowUsed[cand.ri] >= perRowCap[cand.ri]) continue;
      const cell = rows[cand.ri].cells[cand.ci];
      const ref = next();
      cell.blank = true;
      cell.ref = ref;
      cell.difficulty = MARKER_DIFFICULTY[cell.mark] ?? 'low';
      perRowUsed[cand.ri]++;
      taken++;
      items.push({
        ref,
        where: `${rows[cand.ri].label} · ${t.matrix.columns[cand.ci].label}`,
        answer: cell.v,
        difficulty: cell.difficulty,
      });
    }

    // --- decisive distinction ------------------------------------------------
    if (t.decisive?.answer) {
      const ref = next();
      t.decisive.recall = { ref };
      items.push({
        ref, where: model.lang === 'ko' ? '결정적 변별' : 'Decisive distinction',
        answer: t.decisive.answer, difficulty: 'high',
      });
    }
    for (const p of t.decisive?.pairs ?? []) {
      if (!p.clue) continue;
      const ref = next();
      p.recall = { ref };
      items.push({
        ref, where: `${p.a} / ${p.b}`, answer: p.clue, difficulty: 'high',
      });
    }

    // --- traps: withhold the exception, keep the cue visible -----------------
    for (const tr of t.traps ?? []) {
      if (!tr.exception) continue;
      const ref = next();
      tr.recall = { ref };
      items.push({
        ref, where: tr.cue, answer: tr.exception, difficulty: 'high',
      });
    }

    if (items.length) key.push({ topic: t, items });
  }

  model.recall = { key, total: counter };
  return key;
}

const CYCLE = ['LEARN', 'STRUCTURE', 'COMPARE', 'RETRIEVE', 'APPLY', 'CORRECT', 'COMPRESS'];

/**
 * Which markers this document actually uses. The legend teaches six of them,
 * which is a vocabulary test rather than a key when the learner has only used
 * two — so the table is filtered to what is genuinely on the page.
 */
/** Marker label in the document's own language — "갈림", not "DIST". */
function markLabel(k, t) {
  return t === T.ko ? MARKERS[k].label_ko : MARKERS[k].code;
}

function usedMarkers(model) {
  const used = new Set(['core']);
  for (const tp of model.topics) {
    tp.matrix.columns.forEach((c) => used.add(c.mark || 'core'));
    tp.matrix.rows.forEach((r) => r.cells.forEach((c) => used.add(c.mark || 'core')));
    if (tp.traps.length) used.add('trap');
    if (tp.evidence.length) used.add('evidence');
  }
  for (const i of model.compression?.l2 ?? []) if (i.mark) used.add(i.mark);
  return Object.keys(MARKERS).filter((k) => used.has(k));
}

/* ------------------------------------------------------------------ utils */

const list = (arr, cls = '') =>
  (arr ?? []).length
    ? `<ul class="${cls}" style="margin:0;padding-left:4.5mm">${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`
    : '<span style="color:var(--muted)">—</span>';

const confDots = (n) =>
  n ? `<span class="pill b wide">${'●'.repeat(n)}${'○'.repeat(5 - n)} ${n}/5</span>` : '—';

/** Body height in mm left by the @page margins in styles.css. */
const PAGE_BODY = { portrait: 266, landscape: 182 };
/** Conservative allowances for the furniture that shares a matrix page. */
const CHROME = { head: 32, headCont: 4, thead: 15, legend: 9, own: 32 };

/**
 * Decides the matrix row height, and whether the "detail I added myself" block
 * still fits underneath.
 *
 * Short matrices are stretched so they use their page instead of stranding two
 * thirds of it; long ones fall back to the readable minimum and paginate with a
 * repeated header. Font size is never the variable. The `own` decision exists
 * because a ruled block that overflows produces a page containing nothing but
 * three lines, which is exactly the awkward empty page we are trying to avoid.
 */
function matrixMetrics(nRows, orientation, edition, isFirstChunk) {
  const base = PAGE_BODY[orientation]
    - (isFirstChunk ? CHROME.head : CHROME.headCont)
    - CHROME.thead - CHROME.legend;
  const { min, max } = edition === 'recall' ? { min: 16, max: 32 } : { min: 9, max: 22 };

  const withOwn = base - CHROME.own;
  if (nRows * min <= withOwn) {
    const rh = Math.min(max, Math.floor(withOwn / nRows));
    // Whatever the rows do not use becomes ruled writing space rather than a
    // stranded third of a page. Capped so it never reads as padding.
    const ownH = Math.max(18, Math.min(72, base - nRows * rh - 10));
    return { rh, own: true, ownH };
  }
  if (nRows * min <= base) {
    return { rh: Math.min(max, Math.floor(base / nRows)), own: false, ownH: 0 };
  }
  return { rh: min, own: false, ownH: 0 };
}

function head(t, { eyebrow, title, sub, rhs }) {
  return `<header class="page-head">
    <div>
      <div class="eyebrow">${esc(eyebrow)}</div>
      <h1 class="title">${esc(title)}</h1>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
    </div>
    ${rhs ? `<div class="rhs">${rhs}</div>` : ''}
  </header>`;
}

function legend(t, model) {
  const keys = model ? usedMarkers(model) : Object.keys(MARKERS);
  return `<div class="legend">${keys.map((k) =>
    `<span>${MARKERS[k].sigil ? MARKERS[k].sigil + ' ' : ''}<b>${esc(markLabel(k, t))}</b>` +
    `${t === T.ko ? '' : ' ' + esc(MARKERS[k].label_ko)}</span>`
  ).join('')}</div>`;
}

/* ------------------------------------------------------------------- pages */

function pageDashboard(model, t, edLabel) {
  const e = model.exam;
  const dd = e.days_remaining;

  // Print what the learner actually filled in. A dashboard of em-dashes is the
  // fastest way to make a first-time user think they did it wrong, so every
  // block here is omitted rather than stubbed when it has no content.
  const metaCells = [
    e.date        && `<div><dt>${t.exam_date}</dt><dd class="big">${esc(e.date)}</dd></div>`,
    dd !== null   && `<div><dt>${t.days_left}</dt><dd class="big">${dd >= 0 ? `D-${dd}` : `D+${-dd}`}</dd></div>`,
    e.target_score && `<div><dt>${t.target}</dt><dd class="big">${esc(e.target_score)}</dd></div>`,
    e.passing     && `<div><dt>${t.passing}</dt><dd>${esc(e.passing)}</dd></div>`,
    e.syllabus_version && `<div><dt>${t.syllabus}</dt><dd>${esc(e.syllabus_version)}</dd></div>`,
    e.confidence  && `<div><dt>${t.confidence}</dt><dd>${confDots(e.confidence)}</dd></div>`,
  ].filter(Boolean);

  const subjects = (e.subjects ?? []).length, sources = (e.sources ?? []).length;
  const tests = (e.what_it_tests ?? []).length;
  // The cycle strip is orientation for someone running the whole method. On a
  // first, single-topic note it is just vocabulary the learner did not ask for.
  const showCycle = model.topics.length > 1
    || (model.compression?.l2?.length ?? 0) > 0
    || model.error_log.length > 0;

  return `<section class="page">
  ${head(t, {
    eyebrow: `${t.brand} · ${t.notes}`,
    title: e.name,
    sub: [e.name_sub, e.authority].filter(Boolean).join(' · '),
    rhs: `<div><b>${esc(edLabel)}</b></div>${e.last_updated ? `<div>${t.updated}: ${esc(e.last_updated)}</div>` : ''}`,
  })}

  ${metaCells.length ? `<div class="meta block">${metaCells.join('')}</div>` : ''}

  ${tests ? `<h2 class="section">${t.what_tests}</h2>
  <div class="block">${list(e.what_it_tests)}</div>` : ''}

  ${(subjects || sources) ? `<div class="meta two block">
    ${subjects ? `<div><dt>${t.subjects}</dt><dd>${list(e.subjects)}</dd></div>` : ''}
    ${sources ? `<div><dt>${t.sources}</dt><dd>${list(e.sources)}</dd></div>` : ''}
  </div>` : ''}

  ${showCycle ? '' : `<h2 class="section">${t.howto}</h2>
  <ol class="howto block">${t.howto_steps.map((x) => `<li>${x}</li>`).join('')}</ol>`}

  ${showCycle ? `<h2 class="section">${t.cycle}</h2>
  <div class="block" style="display:flex;gap:1.5mm;font-family:var(--font-mono);font-size:7pt;letter-spacing:.06em">
    ${CYCLE.map((c, i) => `<span style="flex:1;text-align:center;padding:1.8mm .5mm;border:.6pt solid var(--rule);${i === 5 ? 'border-width:1.4pt;border-color:var(--ink)' : ''}">${c}</span>`).join('<span style="align-self:center;color:var(--muted)">›</span>')}
  </div>
  <p class="note">${esc(t === T.ko
    ? 'CORRECT 단계가 이 시스템의 핵심이다. 오답은 매트릭스의 특정 셀을 수정하며, 그 셀은 다음 인출 훈련에서 다시 출제된다.'
    : 'CORRECT is the load-bearing step. A wrong answer edits a named matrix cell, and that cell comes back in the next recall pass.')}</p>` : ''}

  <h2 class="section">${t.notation}<span class="hint">${t.notation_hint}</span></h2>
  <table class="block">
    <thead><tr><th style="width:16%">${t.n_marker}</th><th style="width:34%">${t.n_means}</th>
      <th>${t.n_do}</th></tr></thead>
    <tbody>${usedMarkers(model).map((k) => `<tr>
      <td class="m-${k}"><span class="chip">${MARKERS[k].sigil} ${esc(markLabel(k, t))}</span></td>
      <td>${esc(t.marker_means[k])}</td>
      <td>${esc(t.marker_do[k])}</td>
    </tr>`).join('')}</tbody>
  </table>
</section>`;
}

function pageBlueprint(model, t) {
  const e = model.exam;
  const bp = e.blueprint ?? [];
  const lists = (e.high_yield ?? []).length + (e.weak ?? []).length + (e.volatile ?? []).length;
  // Nothing to plan and only one topic to index — the page would be a header
  // over three empty boxes, so it is not printed at all.
  if (!bp.length && !lists && model.topics.length < 2) return '';
  return `<section class="page">
  ${head(t, { eyebrow: t.brand, title: t.blueprint, sub: e.name })}

  ${bp.length ? `<table class="block">
    <thead><tr>
      <th style="width:32%">${t.domain}</th><th style="width:9%">${t.weight}</th>
      <th style="width:22%">${t.qtype}</th><th style="width:9%">${t.priority}</th>
      <th style="width:14%">${t.confidence}</th><th style="width:14%">${t.last_review}</th>
    </tr></thead>
    <tbody>${bp.map((b) => `<tr>
      <td><b>${esc(b.domain)}</b></td>
      <td>${esc(b.weight ?? '')}${typeof b.weight === 'number' ? '%' : ''}</td>
      <td>${esc(b.question_type ?? '')}</td>
      <td>${b.priority ? `<span class="pill ${b.priority === 'A' ? 'a' : 'b'}">${b.priority}</span>` : ''}</td>
      <td>${b.confidence ? confDots(b.confidence) : ''}</td>
      <td>${esc(b.last_review ?? '')}</td>
    </tr>`).join('')}</tbody>
  </table>` : ''}

  ${lists ? `<div class="meta block">
    <div><dt>${t.high_yield}</dt><dd>${list(e.high_yield)}</dd></div>
    <div><dt>${t.weak}</dt><dd>${list(e.weak)}</dd></div>
    <div><dt>${t.volatile}</dt><dd>${list(e.volatile)}</dd></div>
  </div>` : ''}

  <h2 class="section">${t.topic_index}</h2>
  <table class="toc block">
    <thead><tr><th>#</th><th>${t.topic}</th><th style="width:22%">${t.archetype}</th>
      <th style="width:10%">${t.priority}</th><th style="width:10%">${t.rows}</th></tr></thead>
    <tbody>${model.topics.map((tp) => `<tr>
      <td>${String(tp.index).padStart(2, '0')}</td>
      <td><b>${esc(tp.title)}</b>${tp.key_axis ? `<div style="color:var(--muted);font-size:8pt">${esc(tp.key_axis)}</div>` : ''}</td>
      <td>${esc(tp.archetypeLabel)}</td>
      <td>${tp.importance ? `<span class="pill ${tp.importance === 'A' ? 'a' : 'b'}">${tp.importance}</span>` : ''}</td>
      <td>${tp.matrix.rows.length}</td>
    </tr>`).join('')}</tbody>
  </table>
</section>`;
}

function pageTopicOpen(tp, model, t, edition) {
  const isRecall = edition === 'recall';
  const os = tp.one_sentence;
  return `<section class="page">
  ${head(t, {
    eyebrow: `${t.topic} ${String(tp.index).padStart(2, '0')} · ${tp.archetypeLabel}`,
    title: tp.title,
    sub: tp.key_axis ? `${t.key_axis}: ${tp.key_axis}` : '',
    rhs: `${tp.importance ? `<div><span class="pill ${tp.importance === 'A' ? 'a' : 'b'}">${tp.importance}</span></div>` : ''}
          ${tp.frequency ? `<div>${esc(tp.frequency)}</div>` : ''}
          ${tp.updated ? `<div>${t.updated}: ${esc(tp.updated)}</div>` : ''}`,
  })}

  <div class="block">
    ${tp.why ? `<p class="kv"><b>${t.why}</b><br>${esc(tp.why)}</p>` : ''}
    ${tp.core_question ? `<p class="kv"><b>${t.core_q}</b><br>${esc(tp.core_question)}</p>` : ''}
    <p class="kv"><b>${t.prereq}</b> ${esc((tp.prerequisites ?? []).join(' · ') || '—')}
       &nbsp;&nbsp;<b>${t.source}</b> ${esc((tp.sources ?? []).join(' · ') || '—')}</p>
  </div>

  <h2 class="section">${t.one_sentence}</h2>
  <div class="one-sentence block">
    <div class="prompt">${t.one_sentence_prompt}</div>
    ${(!isRecall && os)
      ? `<div class="answer">${esc(os)}</div>`
      : `<div class="lines short">${isRecall && tp.recall_one_sentence
            ? `<span class="blank-tag">⟨${tp.recall_one_sentence.ref}⟩</span>` : ''}</div>`}
  </div>

  <h2 class="section">${t.essentials}<span class="hint">${t.essentials_hint}</span></h2>
  <ol class="essentials block">
    ${Array.from({ length: 5 }, (_, i) => {
      const v = tp.essentials[i];
      return `<li><span>${v ? esc(v) : ''}</span></li>`;
    }).join('')}
  </ol>
</section>`;
}

function matrixTable(tp, chunk, plan, t, edition) {
  const isRecall = edition === 'recall';
  const w = columnWidths(chunk, tp.matrix.rows, plan.orientation);
  const { rh } = matrixMetrics(tp.matrix.rows.length, plan.orientation, edition, chunk.index === 1);
  const contLabel = plan.chunks.length > 1
    ? `<span class="cont">${t.cont.replace('%s', chunk.index).replace('%s', chunk.total)}</span>` : '';

  const headCells = chunk.columns.map((c) => {
    const m = MARKERS[c.mark];
    const chip = c.mark && c.mark !== 'core' ? `<span class="chip">${m.sigil} ${esc(markLabel(c.mark, t))}</span><br>` : '';
    return `<th>${chip}${esc(c.label)}</th>`;
  }).join('');

  const body = tp.matrix.rows.map((r) => {
    const cells = chunk.indices.map((ci) => {
      const c = r.cells[ci];
      const cls = `m-${c.mark}${isRecall && c.blank ? ' blank' : ''}`;
      if (isRecall && c.blank) {
        return `<td class="${cls}"><span class="blank-tag">${c.ref}</span>` +
               `<span class="blank-diff">${DIFFICULTY_GLYPH[c.difficulty]}</span></td>`;
      }
      const colMark = chunk.columns[chunk.indices.indexOf(ci)]?.mark;
      const sig = (c.mark !== 'core' && c.mark !== colMark) ? `<span class="sigil">${MARKERS[c.mark].sigil}</span>` : '';
      return `<td class="${cls}">${sig}${esc(c.v) || '<span style="color:var(--hair)">—</span>'}` +
             `${c.note ? `<span class="cell-note">${esc(c.note)}</span>` : ''}</td>`;
    }).join('');
    return `<tr style="height:${rh}mm"><td class="rowlab">${esc(r.label)}${r.sub ? `<span class="sub">${esc(r.sub)}</span>` : ''}</td>${cells}</tr>`;
  }).join('');

  return `<table class="matrix${isRecall ? ' recall' : ''}">
    <colgroup><col style="width:${w.label}%">${w.cols.map((c) => `<col style="width:${c}%">`).join('')}</colgroup>
    <thead>
      <tr class="mx-title"><th colspan="${chunk.columns.length + 1}">${esc(tp.title)} — ${t.matrix}${contLabel}</th></tr>
      <tr class="mx-cols"><th class="rowlab">${esc(tp.matrix.row_label)}</th>${headCells}</tr>
    </thead>
    <tbody>${body}</tbody>
  </table>`;
}

function pagesMatrix(tp, model, t, edition) {
  const plan = planMatrix(tp.matrix, edition === 'recall' ? 'recall' : 'full');
  return plan.chunks.map((chunk, i) => {
    const { own, ownH } = matrixMetrics(tp.matrix.rows.length, plan.orientation, edition, chunk.index === 1);
    return `<section class="page${plan.orientation === 'landscape' ? ' land' : ''}">
    ${i === 0 ? head(t, {
      eyebrow: `${t.topic} ${String(tp.index).padStart(2, '0')} · ${t.matrix}`,
      title: tp.title,
      sub: tp.matrix.note ?? '',
      rhs: `<div>${esc(tp.archetypeLabel)}</div><div>${tp.matrix.rows.length} × ${tp.matrix.columns.length}</div>`,
    }) : ''}
    ${matrixTable(tp, chunk, plan, t, edition)}
    ${legend(t, model)}
    ${own ? `<div class="own"><div class="lbl">${t.own_detail}</div>
      <div class="lines" style="min-height:${ownH}mm"></div></div>` : ''}
  </section>`;
  }).join('');
}

function pageDistinction(tp, model, t, edition) {
  const isRecall = edition === 'recall';
  const d = tp.decisive;
  const hasAny = d || tp.traps.length || tp.evidence.length;
  if (!hasAny) return '';

  const decisive = d ? `
  <h2 class="section">${t.decisive}</h2>
  <div class="decisive block">
    <div class="q">${esc(d.prompt ?? t.decisive_prompt)}</div>
    ${(!isRecall && d.answer)
      ? `<div class="a">${esc(d.answer)}</div>`
      : `<div class="lines short">${isRecall && d.recall ? `<span class="blank-tag">⟨${d.recall.ref}⟩</span>` : ''}</div>`}
  </div>
  ${(d.pairs ?? []).length ? `
  <h2 class="section">${t.pairs}</h2>
  <table class="block">
    <thead><tr><th style="width:19%">${t.p_a}</th><th style="width:19%">${t.p_b}</th>
      <th style="width:31%">${t.p_why}</th><th style="width:31%">${t.p_clue}</th></tr></thead>
    <tbody>${d.pairs.map((p) => `<tr style="height:13mm">
      <td><b>${esc(p.a)}</b></td><td><b>${esc(p.b)}</b></td><td>${esc(p.why ?? '')}</td>
      <td class="m-distinction">${(!isRecall || !p.recall) ? esc(p.clue ?? '')
        : `<span class="blank-tag">⟨${p.recall.ref}⟩</span><span class="blank-diff">${DIFFICULTY_GLYPH.high}</span>`}</td>

  </table>` : ''}` : '';

  <h2 class="section">${t.traps}<span class="hint">${t.traps_hint}</span></h2>
  <table class="block">
    <thead><tr><th style="width:28%">${t.t_cue}</th><th style="width:16%">${t.t_usually}</th>
      <th style="width:24%">${t.t_exc}</th><th style="width:22%">${t.t_why}</th>
      <th style="width:10%">${t.t_src}</th></tr></thead>
    <tbody>${tp.traps.map((tr) => `<tr style="height:13mm">
      <td><span class="sigil">${MARKERS.trap.sigil}</span>${esc(tr.cue)}</td>
      <td>${esc(tr.usually ?? '')}</td>
      <td class="m-exception">${(!isRecall || !tr.recall) ? esc(tr.exception ?? '')
        : `<span class="blank-tag">⟨${tr.recall.ref}⟩</span><span class="blank-diff">${DIFFICULTY_GLYPH.high}</span>`}</td>
      <td>${esc(tr.why ?? '')}</td>
      <td style="font-size:7.5pt">${esc(tr.source ?? '')}</td>
    </tr>`).join('')}</tbody>
  </table>` : '';

  const evidence = tp.evidence.length ? `
  <h2 class="section">${t.evidence}</h2>
  <table class="block">
    <thead><tr><th style="width:22%">${t.e_cell}</th><th style="width:14%">${t.e_src}</th>
      <th style="width:12%">${t.e_exam}</th><th style="width:12%">${t.e_q}</th>
      <th style="width:29%">${t.e_as}</th><th class="nowrap" style="width:11%">${t.e_risk}</th></tr></thead>
    <tbody>${tp.evidence.map((ev) => `<tr>
      <td style="font-size:8pt">${esc(ev.cellRef?.short ?? ev.cellRef?.text ?? '')}</td>
      <td style="font-size:8pt">${esc(ev.source ?? '')}</td>
      <td style="font-size:8pt">${esc(ev.exam ?? '')}</td>
      <td style="font-size:8pt">${esc(ev.question ?? '')}</td>
      <td class="m-evidence">${esc(ev.tested_as ?? '')}</td>
      <td>${ev.risk ? `<span class="pill ${ev.risk === 'high' ? 'a' : 'b'}">${t.risk[ev.risk]}</span>` : ''}</td>
